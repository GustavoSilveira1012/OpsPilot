name: Temporary OPS-006 formatting
on:
  push:
    branches: [feat/ops-006-incident-management-ui]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format OPS-006 files
        run: |
          pnpm exec prettier --write "apps/web/src/app/(platform)/[org]/workspace-nav.tsx" "apps/web/src/app/(platform)/[org]/incidents/page.tsx" "apps/web/src/app/(platform)/[org]/incidents/[id]/page.tsx" apps/web/src/components/incidents/incident-catalog.tsx apps/web/src/components/incidents/incident-details.tsx docs/ops-006.md
          git add "apps/web/src/app/(platform)/[org]/workspace-nav.tsx" "apps/web/src/app/(platform)/[org]/incidents/page.tsx" "apps/web/src/app/(platform)/[org]/incidents/[id]/page.tsx" apps/web/src/components/incidents/incident-catalog.tsx apps/web/src/components/incidents/incident-details.tsx docs/ops-006.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(ops-006): format incident UI"
            git push origin HEAD:feat/ops-006-incident-management-ui
          fi

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: opspilot
          POSTGRES_PASSWORD: opspilot_test
          POSTGRES_DB: opspilot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U opspilot -d opspilot_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm db:validate

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Apply test database migrations
        run: pnpm db:migrate:deploy
        env:
          DATABASE_URL: postgresql://opspilot:opspilot_test@localhost:5432/opspilot_test?schema=public

      - name: Check authentication and tenant isolation
        run: pnpm test:integration
        env:
          TEST_DATABASE_URL: postgresql://opspilot:opspilot_test@localhost:5432/opspilot_test?schema=public

      - name: Check protected pages, confirmation and session refresh
        run: pnpm test:platform
        env:
          TEST_DATABASE_URL: postgresql://opspilot:opspilot_test@localhost:5432/opspilot_test?schema=public

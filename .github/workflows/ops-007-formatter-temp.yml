name: OPS-007 temporary formatter
on:
  push:
    branches: [feat/ops-007-incident-collaboration]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format all OPS-007 files
        run: |
          pnpm exec prettier --write apps/api/src/incidents/incidents.controller.ts apps/api/src/incidents/incidents.service.ts apps/api/src/incidents/update-incident.dto.ts apps/api/test/incidents.e2e.test.mjs apps/web/src/components/incidents/incident-details.tsx apps/web/src/components/incidents/incident-responders.tsx "apps/web/src/app/(platform)/[org]/incidents/[id]/page.tsx" packages/contracts/src/index.ts docs/ops-007.md
          git add apps/api/src/incidents/incidents.controller.ts apps/api/src/incidents/incidents.service.ts apps/api/src/incidents/update-incident.dto.ts apps/api/test/incidents.e2e.test.mjs apps/web/src/components/incidents/incident-details.tsx apps/web/src/components/incidents/incident-responders.tsx "apps/web/src/app/(platform)/[org]/incidents/[id]/page.tsx" packages/contracts/src/index.ts docs/ops-007.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(ops-007): apply repo Prettier rules"
            git push origin HEAD:feat/ops-007-incident-collaboration
          fi

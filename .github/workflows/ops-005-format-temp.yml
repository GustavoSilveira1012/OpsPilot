name: Temporary OPS-005 formatter

on:
  push:
    branches:
      - codex/ops-005-incident-lifecycle-20261023

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed OPS-005 files
        run: |
          pnpm exec prettier --write apps/api/src/incidents/create-incident-note.dto.ts apps/api/src/incidents/incidents.service.ts apps/api/src/incidents/update-incident.dto.ts apps/api/test/incidents.e2e.test.mjs docs/ops-005.md packages/contracts/src/index.ts
          git add apps/api/src/incidents/create-incident-note.dto.ts apps/api/src/incidents/incidents.service.ts apps/api/src/incidents/update-incident.dto.ts apps/api/test/incidents.e2e.test.mjs docs/ops-005.md packages/contracts/src/index.ts
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(ops-005): apply repository Prettier rules"
            git push origin HEAD:codex/ops-005-incident-lifecycle-20261023
          fi

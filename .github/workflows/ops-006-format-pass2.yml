name: OPS-006 temporary formatting
on:
  push:
    branches: [feat/ops-006-incident-management-ui]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write "apps/web/src/app/(platform)/[org]/incidents/page.tsx" "apps/web/src/app/(platform)/[org]/incidents/[id]/page.tsx" apps/web/test/session.e2e.test.mjs
          git add "apps/web/src/app/(platform)/[org]/incidents/page.tsx" "apps/web/src/app/(platform)/[org]/incidents/[id]/page.tsx" apps/web/test/session.e2e.test.mjs
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(ops-006): format UI and platform test"
            git push origin HEAD:feat/ops-006-incident-management-ui
          fi
